name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements/prod.txt'
      - name: System packages (mysqlclient build, LibreOffice for the PDF tests)
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq pkg-config default-libmysqlclient-dev libreoffice-writer-nogui fonts-liberation fonts-noto-core
      - name: Python packages
        run: pip install -r requirements/prod.txt
      - name: Checks and tests
        working-directory: src/MedicalForms
        run: |
          python manage.py check --settings=MedicalForms.settings.dev
          python manage.py makemigrations --check --dry-run --settings=MedicalForms.settings.dev
          if [ -f apps/mdf/tests/test_size_guard.py ]; then
            python manage.py test apps.mdf.tests.test_size_guard --settings=MedicalForms.settings.dev
          else
            python manage.py test apps.mdf.test_size_guard --settings=MedicalForms.settings.dev
          fi
          python manage.py test --settings=MedicalForms.settings.dev
