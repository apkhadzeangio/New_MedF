    <!-- Clinical Rule Source Citation Modal -->
    <dialog id="po-rule-modal" class="po-rule-dialog d-print-none" data-catalog-url="{{ rules_catalog_url }}" aria-labelledby="po-rm-title">
        <div class="po-rm-head">
            <div>
                <div class="d-flex flex-wrap align-items-center gap-1 mb-1">
                    <code class="po-rule-id" id="po-rm-id"></code>
                    <span class="po-badge st-in_progress" id="po-rm-domain"></span>
                    <span class="po-badge" id="po-rm-status"></span>
                </div>
                <h3 class="m-0" id="po-rm-title" style="font-size:16px"></h3>
            </div>
            <button type="button" class="x-btn sm" id="po-rm-close" aria-label="დახურვა">✕</button>
        </div>
        <div class="po-rm-body">
            <p id="po-rm-desc" class="mb-2" style="font-size:14px"></p>
            <div class="po-rule-meta">
                <div><b>პირველწყარო:</b> <span id="po-rm-source"></span></div>
                <div><b>კლასი / დონე:</b> <strong id="po-rm-class"></strong></div>
                <div><b>წყაროს ფორმულირება:</b> <em id="po-rm-wording"></em></div>
                <div><b>სისტემის ზღვარი / მნიშვნელობა:</b> <span id="po-rm-val"></span></div>
                <div class="small text-muted">გადამოწმების თარიღი: <span id="po-rm-verified"></span></div>
            </div>
        </div>
        <div class="po-rm-foot">
            <a href="{{ rules_catalog_url }}" id="po-rm-link" target="_blank" rel="noopener" class="x-btn sm">სრული ჩანაწერი რეესტრში ↗</a>
            <button type="button" class="x-btn sm primary" id="po-rm-ok">დახურვა</button>
        </div>
    </dialog>
