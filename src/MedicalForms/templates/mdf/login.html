{% extends 'base.html' %}

{% block header %}{% endblock %}

{% block content %}
<div id="login">
    <h3 class="text-center text-white pt-5">Niv 300 9/ა</h3>
    <div class="container">
        <div id="login-row" class="row justify-content-center align-items-center d-flex mt-5">
            <div id="login-column" class="col-md-6">
                <div id="login-box" class="col-md-12">
                    <form id="login-form" class="form" action="" method="post">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        <h3 class="text-center text-primary">სისტემაში ავტორიზაცია</h3>
                        {% if message %}
                            <div class="alert alert-danger py-2" role="alert">{{ message }}</div>
                        {% endif %}
                        <div class="form-group">
                            <label for="username" class="text-primaryX">მომხმარებელი</label><br>
                            <input type="text" name="username" id="username" class="form-control" value="{{ form.username.value|default:'' }}" autocomplete="username" autocapitalize="none" required autofocus>
                        </div>
                        <div class="form-group">
                            <label for="password" class="text-primaryX">პაროლი</label><br>
                            <input type="password" name="password" id="password" class="form-control" autocomplete="current-password" required>
                        </div>
                        <div class="form-group mb-3 mt-3">
                            <label for="remember-me" class="text-primary d-flex align-items-center">
                                დამახსოვრება
                                <input id="remember-me" name="remember_me" type="checkbox" class="ms-2" style="height: 20px; width: 20px;"{% if form.remember_me.value %} checked{% endif %}>
                            </label>
                        </div>
                        <div class="text-center mt-3">
                            <input type="submit" name="submit" class="btn btn-primary btn-md px-5 fs-5" value="შესვლა">
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
