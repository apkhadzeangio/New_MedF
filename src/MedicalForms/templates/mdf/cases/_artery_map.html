{% load static %}<svg class="am{% if interactive %} am-edit{% endif %}" viewBox="{{ am.view }}" role="img" aria-label="არტერიების რუკა — {{ side_name }}">
    <g{% if am.side == 'L' %} transform="translate({{ am.axis }},0) scale(-1,1)"{% endif %}>
        <image class="am-img" href="{% static am.image.src %}" x="0" y="0" width="{{ am.image.width }}" height="{{ am.image.height }}" preserveAspectRatio="none"/>
        {% for c in am.context %}<path class="am-ctx" d="{{ c }}"/>{% endfor %}
        {% for s in am.segments %}
        <g class="{{ s.css }}" style="--w:{{ s.w }}" data-seg="{{ s.key }}" data-state="{{ s.state }}" data-flags="{{ s.flags|join:',' }}"{% if interactive %} tabindex="0" role="button"{% endif %} aria-label="{{ s.name }}">
            <title>{{ s.name }}</title>
            <path class="sg-shell" d="{{ s.d }}"/>
            <path class="sg-line" d="{{ s.d }}"/>
            <path class="sg-gloss" d="{{ s.d }}"/>
            <path class="sg-mark" d="{{ s.d }}"/>
            <path class="sg-hit" d="{{ s.d }}"/>
        </g>
        {% endfor %}
    </g>
    {% for m in am.marks %}<line class="am-mark" x1="{{ m.x1 }}" x2="{{ m.x2 }}" y1="{{ m.y }}" y2="{{ m.y }}"/><text class="am-mtext" x="{{ m.x1 }}" y="{{ m.ty }}" text-anchor="{{ m.anchor }}">{{ m.text }}</text>{% endfor %}
    {% for l in am.labels %}<text class="am-lab" x="{{ l.x }}" y="{{ l.y }}" text-anchor="{{ l.anchor }}" dominant-baseline="middle"{% if l.vertical %} transform="rotate(-90 {{ l.x }} {{ l.y }})"{% endif %}>{{ l.text }}</text>{% endfor %}
</svg>
