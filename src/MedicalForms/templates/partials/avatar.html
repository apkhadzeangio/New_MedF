{# usage: include "partials/avatar.html" with profile=... size=40 #}
{% with url=profile.avatar_url %}{% if url %}<img src="{{ url }}" alt="{{ profile.display_name }}" class="avatar" style="width:{{ size|default:40 }}px;height:{{ size|default:40 }}px">{% else %}<span class="avatar avatar-initial avatar-c{{ profile.order|default:0|add:0 }}" style="width:{{ size|default:40 }}px;height:{{ size|default:40 }}px;font-size:{% widthratio size|default:40 100 42 %}px">{{ profile.initial }}</span>{% endif %}{% endwith %}
