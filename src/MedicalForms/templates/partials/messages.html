{% if messages %}
<div class="app-main pb-0" id="flash-messages" style="padding-bottom: 0">
    {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show py-2 mb-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="დახურვა"></button>
        </div>
    {% endfor %}
</div>
{% endif %}
