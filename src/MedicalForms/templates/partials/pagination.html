{% if page_obj %}
<nav aria-label="Page navigation" style="padding-bottom: 50px;">
  <ul class="pagination flex-wrap">
    {% if page_obj.has_previous %}
      <li class="page-item">
        <a class="page-link" href="?page={{ page_obj.previous_page_number }}{% if q %}&q={{ q }}{% endif %}" aria-label="Previous">
            <span aria-hidden="true">&laquo;</span>
        </a>
      </li>
    {% endif %}
    {% for pn in paginator.page_range %}
        {% if pn == page_obj.number %}
            <li class="page-item active">
                <a class="page-link" href="javascript:void(0)">{{ page_obj.number }}</a>
            </li>
        {% else %}
            <li class="page-item">
                <a class="page-link" href="?page={{ pn }}{% if c %}&c={{ c }}{% endif %}{% if q %}&q={{ q }}{% endif %}">{{ pn }}</a>
            </li>
        {% endif %}
    {% endfor %}
    {% if page_obj.has_next %}
      <li class="page-item">
        <a class="page-link" href="?page={{ page_obj.next_page_number }}{% if q %}&q={{ q }}{% endif %}" aria-label="Next">
          <span aria-hidden="true">&raquo;</span>
        </a>
      </li>
    {% endif %}
  </ul>
</nav>
{% endif %}
