{% load static %}
<!DOCTYPE html>
<html lang="ka">
<head>
	<meta charset="UTF-8">
	<title>Medical Forms</title>
	<!-- responsive meta -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<!-- For IE -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="icon" type="image/png" href="{% static 'img/healthcare.png' %}" sizes="16x16">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}?v=1">
    <link rel="stylesheet" href="{% static 'css/jquery-ui.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=25">

    {% block extra_styles %}
    {% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

{% block header %}
    {% include "partials/header.html" %}
{% endblock %}

{% block content %}
{% endblock %}

{% block footer %}
    {% include "partials/footer.html" %}
{% endblock %}

<!-- main jQuery -->
<script src="{% static 'js/jquery-3.7.0.min.js' %}"></script>
<script src="{% static 'js/popper.min.js' %}?v=1"></script>
<!-- bootstrap -->
<script src="{% static 'js/bootstrap.min.js' %}?v=1"></script>
<script src="{% static 'js/jquery-ui.min.js' %}"></script>
<script src="{% static 'js/notify.min.js' %}"></script>
<script src="{% static 'js/clipboard.min.js' %}"></script>
<script src="{% static 'js/custom.js' %}?v=28"></script>

{% block extra_scripts %}{% endblock %}

</body>
</html>
